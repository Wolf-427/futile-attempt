<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com"/>
  <title>Scriptum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body>
  <div id="ls">
    <div class="ls-inner">
      <div class="ls-mark">S</div>
      <div class="ls-wordmark">Scriptum</div>
    </div>
  </div>
  <div id="app" style="height:100%;background:#0f0f0d;"></div>
  <script src="js/store.js"></script>
  <script src="js/project.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Always start at project overview.
    Store._data.activeId = null
    App.init()
    // Hide loading screen — everything above is synchronous, app is ready.
    var _ls = document.getElementById('ls')
    if (_ls) {
      _ls.classList.add('ls-out')
      setTimeout(function() { if (_ls.parentNode) _ls.parentNode.removeChild(_ls) }, 500)
    }
  </script>
</body>
</html>
